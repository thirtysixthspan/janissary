approval_policy = "on-request"
sandbox_mode = "danger-full-access"

# Include filters form an allowlist. Preserve the shell environment, including
# Homebrew from ~/.zprofile and nvm from ~/.zshrc, alongside the injected GitHub
# tokens needed by git and gh. Automatic secret exclusions must stay disabled
# because include filters cannot restore a token removed by those exclusions.
[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true

[shell_environment_policy.filters]
PATH = "include"
HOME = "include"
SHELL = "include"
USER = "include"
LOGNAME = "include"
TMPDIR = "include"
ZDOTDIR = "include"
"NVM_*" = "include"
"HOMEBREW_*" = "include"
GH_TOKEN = "include"
GITHUB_TOKEN = "include"
JANISSARY_BROWSER_WS_ENDPOINT = "include"
JANISSARY_PLAYWRIGHT = "include"
JANISSARY_NODE = "include"

[features]
apps = false
