<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janissary · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · janissary</p>
    <h1>One socket, one source of truth</h1>
    <p class="subtitle">The Node server owns all state and renders every snapshot; the React client emits intents and draws what it is sent. Read from <code>master</code> at <code>c494cc31</code>.</p>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Janissary system architecture</title>
      <desc id="architecture-desc">Architecture diagram showing the janus CLI booting a loopback HTTP and WebSocket server that answers a React web client over one socket, a controller that delegates every intent to the command manager, command registry, per-resource manager registry and lazily activated tab plugin host, and a single shared wire contract both sides import.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="40" y="72" width="176" height="264" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="102" y="76" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="128" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

      <rect x="232" y="72" width="688" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="548" y="76" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">SERVER</text>

      <!-- Arrows first (behind boxes) -->
      <!-- CLI boots the server -->
      <path d="M 200,136 H 288 Q 296,136 296,144 V 240"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Client intents up, authoritative snapshots down -->
      <line x1="200" y1="268" x2="248" y2="268" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="248" y1="296" x2="200" y2="296" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Socket handler into the controller -->
      <line x1="428" y1="280" x2="476" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Controller dispatches a command line -->
      <path d="M 620,240 V 208 Q 620,200 628,200 H 752 Q 760,200 760,192 V 168"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Resolve against the registry, then run -->
      <line x1="804" y1="168" x2="804" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="804" y1="320" x2="804" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Everything else the controller delegates straight to a manager -->
      <path d="M 656,296 H 672 Q 680,296 680,304 V 396 Q 680,404 688,404 H 704"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Plugin host: lazily activated, reaches resources through the registry -->
      <path d="M 560,320 V 392" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="656" y1="436" x2="704" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Both sides import the one wire contract -->
      <path d="M 128,320 V 416 Q 128,424 136,424 H 248"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 338,320 V 392" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <text x="128" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web/src · React</text>

      <!-- Node: HTTP + WS Server (focal) -->
      <rect x="248" y="240" width="180" height="80" rx="6" fill="#f5f5f5"/>

      <text x="270" y="257" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS</text>
      <text x="338" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP + WS Server</text>

      <rect x="248" y="392" width="180" height="64" rx="6" fill="#f5f5f5"/>
